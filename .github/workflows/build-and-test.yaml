name: build-and-test
on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - run: go build ./...

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup
      - run: go test ./...
